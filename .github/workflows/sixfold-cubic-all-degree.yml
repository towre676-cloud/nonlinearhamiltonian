name: Sixfold cubic all-degree theorem
on:
  pull_request:
    paths:
      - 'research/hamiltonian/sextic_core.py'
      - 'research/hamiltonian/c3_strata/SIXFOLD_CUBIC_COMPLEMENT_THEOREM.md'
      - 'research/hamiltonian/c3_strata/verify_sixfold_cubic_all_degree.py'
      - 'research/hamiltonian/c3_strata/test_sixfold_cubic_all_degree.py'
      - '.github/workflows/sixfold-cubic-all-degree.yml'
  push:
    paths:
      - 'research/hamiltonian/sextic_core.py'
      - 'research/hamiltonian/c3_strata/SIXFOLD_CUBIC_COMPLEMENT_THEOREM.md'
      - 'research/hamiltonian/c3_strata/verify_sixfold_cubic_all_degree.py'
      - 'research/hamiltonian/c3_strata/test_sixfold_cubic_all_degree.py'
      - '.github/workflows/sixfold-cubic-all-degree.yml'
  workflow_dispatch:
jobs:
  all-degree-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact algebra
        run: python -m pip install sympy==1.14.0
      - name: Verify static basis and nonzero symbolic minor
        run: python research/hamiltonian/c3_strata/verify_sixfold_cubic_all_degree.py > /tmp/sixfold-cubic-theorem.json
      - name: Run theorem and classifier tests
        run: python -m unittest discover -s research/hamiltonian/c3_strata -p 'test_sixfold_cubic_all_degree.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: sixfold-cubic-all-degree-certificate
          path: /tmp/sixfold-cubic-theorem.json
