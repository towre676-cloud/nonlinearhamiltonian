name: QP2 exact refinement replay
on:
  pull_request:
    paths:
      - 'research/hamiltonian/c3_strata/verify_qp2_complete.py'
      - 'research/hamiltonian/c3_strata/QP2_COMPLETE_REFINEMENT.md'
      - '.github/workflows/qp2-refinement.yml'
  workflow_dispatch:
jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.14.0
      - run: python research/hamiltonian/c3_strata/verify_qp2_complete.py
