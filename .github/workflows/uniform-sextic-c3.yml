name: uniform-sextic-c3
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install replay dependencies
        run: python -m pip install sympy==1.14.0
      - name: Replay imported research
        run: |
          cd research/hamiltonian/c3_uniform
          python verify_certificate.py
          python monomial_proof.py
          python -m unittest discover -s . -p test_c3.py -v
          python inputs/check_binary_static.py inputs/binary_static_d6.json
          python inputs/step4_final_checks.py
      - name: Replay repeated-root classification and rational C3 regression
        run: |
          cd research/hamiltonian/c3_strata
          python -m unittest discover -s . -p test_strata.py -v
      - name: Verify squarefree discriminant identities and reject corrupt certificates
        run: |
          cd research/hamiltonian/c3_strata
          python -m unittest discover -s . -p test_squarefree.py -v
      - name: Verify exact sextic classifier and lower-degree perturbations
        run: |
          python -m unittest discover -s research/hamiltonian/c3_strata -p test_sextic_core.py -v
          python research/hamiltonian/c3_strata/verify_sextic_core.py > "$RUNNER_TEMP/sextic-core-replay.json"
          diff -u research/hamiltonian/c3_strata/SEXTIC_CORE_REPLAY.json "$RUNNER_TEMP/sextic-core-replay.json"
      - name: Preserve standard-library partner commands
        run: python -B -X utf8 -S research/hamiltonian/verify_cli.py
