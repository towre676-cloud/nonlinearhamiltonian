name: uniform-sextic-c3
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install replay dependencies
        run: python -m pip install sympy==1.14.0
      - name: Replay imported research
        run: |
          cd research/hamiltonian/c3_uniform
          python verify_certificate.py
          python monomial_proof.py
          python -m unittest discover -s . -p test_c3.py -v
          python inputs/check_binary_static.py inputs/binary_static_d6.json
          python inputs/step4_final_checks.py
