name: nonlinear-b-refinements
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install sympy==1.14.0
      - name: Replay nonlinear families and affine counterexample
        run: |
          python research/hamiltonian/c3_strata/verify_nonlinear_B.py
          python research/hamiltonian/c3_strata/verify_nonconstant_quadratic_sector.py
