name: Sixfold global depth
on:
  pull_request:
    paths:
      - 'research/hamiltonian/c3_strata/sixfold_global_depth.py'
      - 'research/hamiltonian/c3_strata/verify_sixfold_global_depth.py'
      - 'research/hamiltonian/c3_strata/test_sixfold_global_depth.py'
      - 'research/hamiltonian/c3_strata/cube_leading_boundary.py'
      - 'research/hamiltonian/c3_strata/weighted_cubic_form.py'
      - 'research/hamiltonian/c3_strata/exact_observation.py'
      - 'research/hamiltonian/c3_strata/SIXFOLD_GLOBAL_DEPTH*'
      - 'research/hamiltonian/c3_strata/BINOMIAL_NEWTON_PERFECTJET_PIN.txt'
      - '.github/workflows/sixfold-global-depth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact algebra
        run: python -m pip install sympy==1.14.0
      - name: Install pinned independent PerfectJet engine
        shell: bash
        run: |
          PIN="$(cat research/hamiltonian/c3_strata/BINOMIAL_NEWTON_PERFECTJET_PIN.txt)"
          python -m pip install "git+https://github.com/towre676-cloud/PerfectJet.git@${PIN}"
      - name: Classifier, regression anchor and window chains
        run: python -m unittest discover -s research/hamiltonian/c3_strata -p 'test_sixfold_global_depth.py' -v
      - name: Symbolic identities, stored minors, adversarial sweep, PerfectJet cross-check
        working-directory: research/hamiltonian/c3_strata
        run: python verify_sixfold_global_depth.py --perfectjet
      - name: Check retained receipts
        run: |
          git diff --exit-code -- \
            research/hamiltonian/c3_strata/SIXFOLD_GLOBAL_DEPTH_CERTIFICATE.json \
            research/hamiltonian/c3_strata/SIXFOLD_GLOBAL_DEPTH_REPLAY.json
