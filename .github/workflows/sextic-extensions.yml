name: sextic-extensions
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact algebra dependency
        run: python -m pip install sympy==1.14.0
      - name: Replay complete extension evidence and reject corrupted reports
        run: |
          python research/hamiltonian/reproduce_sextic.py \
            --suite quadratic --suite separable --suite reports \
            --output "$RUNNER_TEMP/sextic-extension-reproduction.json"
      - name: Retain reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sextic-extension-reproduction
          path: ${{ runner.temp }}/sextic-extension-reproduction.json
          if-no-files-found: error
