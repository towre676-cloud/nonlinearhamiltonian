name: Sixfold benchmark
on:
  pull_request:
    paths:
      - 'benchmarks/sixfold-jump-loci/**'
      - '.github/workflows/sixfold-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: benchmarks/sixfold-jump-loci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Generate and verify dataset
        run: |
          python generate.py data
          python verify.py data
          cmp reference/exact.jsonl data/exact.jsonl
          python evaluate.py data --predictions baseline_predictions.jsonl > rescored.json
          python -c "import json; assert json.load(open('baseline_report.json'))['test'] == json.load(open('rescored.json'))"
      - name: Replay trajectory identification study
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python experiment.py data identified
      - uses: actions/upload-artifact@v4
        with:
          name: sixfold-hamiltonian-jump-locus-benchmark
          path: benchmarks/sixfold-jump-loci/
          retention-days: 90
